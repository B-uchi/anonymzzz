<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anonymzzz</title>
    <meta name="description" content="Make a link, share it anywhere, and read what people send you anonymously." />
    <meta name="theme-color" content="#f3f1fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15132a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Anonymzzz" />
    <meta property="og:description" content="Got something to say? Put it in an anonymous message." />
    <meta property="og:image" content="https://i.ibb.co/bgyTPq3/anonymous.png" />
    <meta property="og:url" content="https://anonymzzz.vercel.app" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem("anonymzzz.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
